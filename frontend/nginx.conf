server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # The map API answers in JSON that is ~15x smaller compressed (a 256x256
  # chunk is 2.3 MB raw), and a whole view is dozens of chunks - compressing
  # it is the single biggest win for how fast a map appears.
  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_vary on;
  gzip_types application/json text/plain text/css application/javascript image/svg+xml;

  location /api/ {
    proxy_pass http://mundus-api:8080/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Vite fingerprints everything under /assets/, so it never changes under
  # the same name: cache it for good (icons alone are ~2 MB).
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
